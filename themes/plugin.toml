#   https://github.com/tokyo-night/tokyo-night-vscode-theme (MIT; LICENSES/tokyo-night-vscode-theme.txt); the
#   terminal's colours from tokyonight.nvim's extras/kitty/tokyonight_night.conf and tokyonight_day.conf.
