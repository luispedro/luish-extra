# ---------------------------------------------------------------------------------------------------------------------
# catppuccin: mocha on dark backgrounds, latte on light ones, following its style guide where it says (keywords
# mauve, strings green, escapes pink, functions blue, operators sky, constants peach, parameters maroon).
#   Source: Catppuccin, https://github.com/catppuccin/palette and its style guide in
#   https://github.com/catppuccin/catppuccin (MIT, (c) 2021 Catppuccin; LICENSES/catppuccin.txt); the terminal's
#   colours from its kitty themes, https://github.com/catppuccin/kitty, themes/mocha.conf and latte.conf (MIT).
#   mocha: mauve #cba6f7 red #f38ba8 maroon #eba0ac peach #fab387 yellow #f9e2af green #a6e3a1 sky #89dceb
#          sapphire #74c7ec blue #89b4fa pink #f5c2e7 overlay2 #9399b2 overlay1 #7f849c overlay0 #6c7086
#          surface1 #45475a surface2 #585b70 (base #1e1e2e)
#   latte: mauve #8839ef red #d20f39 maroon #e64553 peach #fe640b yellow #df8e1d green #40a02b sky #04a5e5
#          sapphire #209fb5 blue #1e66f5 pink #ea76cb teal #179299 overlay2 #7c7f93 overlay1 #8c8fa1
#          surface0 #ccd0da surface1 #bcc0cc (base #eff1f5)
# Latte's lighter colours are hard to read on its background, so it has variables teal rather than yellow, escapes
# maroon rather than pink, $( mauve, globs bold, operators in the text colour, and the updates of `plugin` peach.

[colorscheme.catppuccin-mocha]
keyword = "bold #cba6f7"
command = "#89b4fa"
"command.function" = "bold #89b4fa"
"command.alias" = "italic #89b4fa"
"command.precommand" = "italic #cba6f7"
"command.directory" = "bold #74c7ec"
"command.history" = "#fab387"
"command.unknown" = "bold #f38ba8"
"arg.option" = "#74c7ec"
string = "#a6e3a1"
"string.escape" = "#f5c2e7"
var = "#f9e2af"
"var.exported" = "bold #f9e2af"
"var.array" = "italic #f9e2af"
"var.special" = "#eba0ac"
"var.readonly" = "#eba0ac"
"var.unset" = "italic #f38ba8"
subst = "bold #f5c2e7"
expand = "#fab387"
op = "bold #89dceb"
redir = "bold #89dceb"
"redir.fd" = "#fab387"
assign = "#f9e2af"
comment = "italic #9399b2"
error = "underline #f38ba8"
path = "underline"
match = "bold bg:#585b70"
"menu.selected" = "bold bg:#45475a"
"menu.description" = "#7f849c"
suggestion = "#6c7086"
"plugin.name" = "bold"
"plugin.ok" = "#a6e3a1"
"plugin.update" = "#f9e2af"
"plugin.warn" = "#fab387"
"plugin.error" = "bold #f38ba8"
"plugin.dim" = "#7f849c"

[colorscheme.catppuccin-mocha.terminal]
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor = "#f5e0dc"
palette = [
    "#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de",
    "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8",
