description = "Colour schemes for luish's line editor, in pairs for dark and light backgrounds"

# Loading this plugin only makes the schemes available; choose a pair in config.toml:
#
#     [style]
#     colorscheme = { dark = "gruvbox-dark", light = "gruvbox-light" }
#
# or with `style -c gruvbox-dark gruvbox-light`. luish picks the one that fits the terminal's background.
#
# Every scheme gives the roles the same meaning, so that changing scheme changes the colours, not what they say:
#
#   command        one colour for every kind of command; functions bold, aliases italic; sudo, env, exec and the
#                  other precommands italic in the keyword's colour, unknown commands bold red
#   keyword        bold, in a colour of its own
#   arg.option     a colour of its own; other arguments are the terminal's text colour
#   op, redir      bold, in the palette's colour for operators if it has one; file descriptors as numbers
#   string         one colour; escapes, and $( ... ) and the expansions (~, {a,b}, *), stand out from it
#   var            one colour, also for the NAME= of an assignment; exported variables bold, arrays italic,
#                  special and read-only ones in a second colour, unset ones italic red
#   comment        italic, in the palette's comment colour, which suggestions and menu descriptions share
#   error          underlined red, added to the text's colours; path is underlined
#   menu.selected  bold on the palette's selection colour (match, a shade further)
#   plugin.*       the output of `plugin`: names bold, what worked green, what changed or can yellow, warnings in
#                  the palette's orange if it has one, errors bold red, detail in the colour of menu descriptions
#
# The palettes' colours are written as #rrggbb, which needs a terminal with 24-bit colour (most have it). Each palette
# scheme also sets the terminal's own colours while it is in use, in its `terminal` table: its background, text and
# cursor colours and its 16 colours, as the palette's authors give them for terminals, so that the programs run from
# the shell match it (`terminal-colors = false` in the user's [style] keeps the terminal's own). `ansi-dark` and
# `ansi-light` set none, and use the terminal's own 16 colours, so they follow whatever palette it has.
#
# The palettes are other people's: README.md here says where each comes from and under which license, and LICENSES/
# has copies of the licenses. Every #rrggbb colour below is the palette's own.

# ---------------------------------------------------------------------------------------------------------------------
# ansi: the terminal's 16 colours (and 136, a dark yellow, on light backgrounds, as default-light has). Brighter than
# default-dark, with options, escapes, special variables and precommands told apart. It sets none of the terminal's
# colours.

[colorscheme.ansi-dark]
keyword = "bold magenta"
command = "green"
"command.function" = "bold green"
"command.alias" = "italic green"
"command.precommand" = "italic magenta"
"command.directory" = "bold bright-blue"
"command.history" = "yellow"
"command.unknown" = "bold red"
"arg.option" = "bright-blue"
string = "yellow"
"string.escape" = "bold bright-yellow"
var = "cyan"
"var.exported" = "bold cyan"
"var.array" = "italic cyan"
"var.special" = "bright-cyan"
"var.readonly" = "bright-cyan"
"var.unset" = "italic red"
subst = "bright-magenta"
expand = "bright-yellow"
op = "bold"
redir = "bold"
"redir.fd" = "bright-yellow"
assign = "cyan"
comment = "italic bright-black"
error = "underline red"
path = "underline"
match = "bold bg:bright-black"
"menu.selected" = "reverse"
"menu.description" = "bright-black"
suggestion = "bright-black"
"plugin.name" = "bold"
"plugin.ok" = "green"
"plugin.update" = "yellow"
"plugin.warn" = "yellow"
"plugin.error" = "bold red"
"plugin.dim" = "bright-black"

# Bright colours wash out on a light background, and yellow can't be read on it.
[colorscheme.ansi-light]
inherits = "ansi-dark"
"command.directory" = "bold blue"
"command.history" = "136"
"arg.option" = "blue"
string = "136"
"string.escape" = "bold 136"
"var.special" = "blue"
"var.readonly" = "blue"
subst = "magenta"
expand = "bold magenta"
"redir.fd" = "magenta"
match = "bold bg:white"
"plugin.update" = "136"
"plugin.warn" = "136"

# ---------------------------------------------------------------------------------------------------------------------
# solarized: the same accents on both backgrounds; only the greys change. A match is reversed yellow, as Solarized's
# Vim scheme has its search matches.
#   Source: Solarized, by Ethan Schoonover, https://github.com/altercation/solarized (MIT; LICENSES/solarized.txt);
#   the terminal's colours as its README maps them (the 16/8 column), with base0 and base00 for the text and cursor,
#   as its Vim scheme has them.
#   yellow #b58900  orange #cb4b16  red #dc322f  magenta #d33682  violet #6c71c4  blue #268bd2  cyan #2aa198
#   green #859900;  dark: base03 #002b36 (background) base02 #073642 base01 #586e75 (comments)
#   light: base3 #fdf6e3 (background) base2 #eee8d5 base1 #93a1a1 (comments)

[colorscheme.solarized-dark]
keyword = "bold #859900"
command = "#268bd2"
"command.function" = "bold #268bd2"
"command.alias" = "italic #268bd2"
"command.precommand" = "italic #859900"
"command.directory" = "bold #2aa198"
"command.history" = "#cb4b16"
"command.unknown" = "bold #dc322f"
"arg.option" = "#6c71c4"
string = "#2aa198"
"string.escape" = "#dc322f"
var = "#b58900"
"var.exported" = "bold #b58900"
"var.array" = "italic #b58900"
"var.special" = "#cb4b16"
"var.readonly" = "#cb4b16"
"var.unset" = "italic #dc322f"
subst = "#d33682"
expand = "#d33682"
op = "bold"
redir = "bold"
"redir.fd" = "#cb4b16"
assign = "#b58900"
comment = "italic #586e75"
error = "underline #dc322f"
path = "underline"
match = "bold reverse #b58900"
"menu.selected" = "bold bg:#073642"
"menu.description" = "#586e75"
suggestion = "#586e75"
"plugin.name" = "bold"
"plugin.ok" = "#859900"
"plugin.update" = "#b58900"
"plugin.warn" = "#cb4b16"
"plugin.error" = "bold #dc322f"
"plugin.dim" = "#586e75"

[colorscheme.solarized-dark.terminal]
background = "#002b36"
foreground = "#839496"
cursor = "#839496"
palette = [
    "#073642", "#dc322f", "#859900", "#b58900", "#268bd2", "#d33682", "#2aa198", "#eee8d5",
    "#002b36", "#cb4b16", "#586e75", "#657b83", "#839496", "#6c71c4", "#93a1a1", "#fdf6e3",
]

[colorscheme.solarized-light]
inherits = "solarized-dark"
comment = "italic #93a1a1"
"menu.selected" = "bold bg:#eee8d5"
"menu.description" = "#93a1a1"
suggestion = "#93a1a1"
"plugin.dim" = "#93a1a1"

# The palette is solarized-dark's: Solarized's 16 colours are the same on both backgrounds.
[colorscheme.solarized-light.terminal]
background = "#fdf6e3"
foreground = "#657b83"
cursor = "#657b83"

# ---------------------------------------------------------------------------------------------------------------------
# gruvbox: the bright accents on the dark background, the faded ones on the light.
#   Source: gruvbox, by Pavel Pertsev (morhetz), https://github.com/morhetz/gruvbox, colors/gruvbox.vim (MIT/X11, as
#   its README and package.json say); the terminal's colours as gruvbox.vim gives them to Neovim's terminal
#   (g:terminal_color_0 to 15), with fg1 for the text and the cursor (its Cursor is the text reversed).
#   dark:  red #fb4934 green #b8bb26 yellow #fabd2f blue #83a598 purple #d3869b aqua #8ec07c orange #fe8019
#          gray #928374 bg1 #3c3836 bg2 #504945 bg3 #665c54 bg4 #7c6f64 (background #282828)
#   light: red #9d0006 green #79740e yellow #b57614 blue #076678 purple #8f3f71 aqua #427b58 orange #af3a03
#          gray #928374 bg1 #ebdbb2 bg2 #d5c4a1 bg3 #bdae93 (background #fbf1c7)
# Keywords are red, as gruvbox has them, so unknown commands are also underlined; numbers (file descriptors) are
# purple, as its constants.

[colorscheme.gruvbox-dark]
keyword = "bold #fb4934"
command = "#fabd2f"
"command.function" = "bold #fabd2f"
"command.alias" = "italic #fabd2f"
"command.precommand" = "italic #fb4934"
"command.directory" = "bold #83a598"
"command.history" = "#fe8019"
"command.unknown" = "bold underline #fb4934"
"arg.option" = "#8ec07c"
string = "#b8bb26"
"string.escape" = "#fe8019"
var = "#83a598"
"var.exported" = "bold #83a598"
"var.array" = "italic #83a598"
"var.special" = "#d3869b"
"var.readonly" = "#d3869b"
"var.unset" = "italic #fb4934"
subst = "bold #d3869b"
expand = "#fe8019"
op = "bold"
redir = "bold"
"redir.fd" = "#d3869b"
assign = "#83a598"
comment = "italic #928374"
error = "underline #fb4934"
path = "underline"
match = "bold bg:#665c54"
"menu.selected" = "bold bg:#504945"
"menu.description" = "#928374"
suggestion = "#7c6f64"
"plugin.name" = "bold"
"plugin.ok" = "#b8bb26"
"plugin.update" = "#fabd2f"
"plugin.warn" = "#fe8019"
"plugin.error" = "bold #fb4934"
"plugin.dim" = "#928374"

[colorscheme.gruvbox-dark.terminal]
background = "#282828"
foreground = "#ebdbb2"
cursor = "#ebdbb2"
palette = [
    "#282828", "#cc241d", "#98971a", "#d79921", "#458588", "#b16286", "#689d6a", "#a89984",
    "#928374", "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c", "#ebdbb2",
]

[colorscheme.gruvbox-light]
inherits = "gruvbox-dark"
keyword = "bold #9d0006"
command = "#b57614"
"command.function" = "bold #b57614"
"command.alias" = "italic #b57614"
"command.precommand" = "italic #9d0006"
"command.directory" = "bold #076678"
"command.history" = "#af3a03"
"command.unknown" = "bold underline #9d0006"
"arg.option" = "#427b58"
string = "#79740e"
"string.escape" = "#af3a03"
var = "#076678"
"var.exported" = "bold #076678"
"var.array" = "italic #076678"
"var.special" = "#8f3f71"
"var.readonly" = "#8f3f71"
"var.unset" = "italic #9d0006"
subst = "bold #8f3f71"
expand = "#af3a03"
"redir.fd" = "#8f3f71"
assign = "#076678"
error = "underline #9d0006"
match = "bold bg:#d5c4a1"
"menu.selected" = "bold bg:#ebdbb2"
"menu.description" = "#7c6f64"
